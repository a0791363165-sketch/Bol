<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bol</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500&family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f2f2;--tx:#000;--mu:#6a6a6a;--gl:rgba(255,255,255,.55);--gb:rgba(0,0,0,.1);--b1:#d4d4d4;--b2:#a8a8a8;--inv:#fff;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--tx:#fff;--mu:#9b9b9b;--gl:rgba(255,255,255,.08);--gb:rgba(255,255,255,.16);--b1:#3c3c3c;--b2:#1c1c1c;--inv:#000}}
:root[data-theme="dark"]{--bg:#000;--tx:#fff;--mu:#9b9b9b;--gl:rgba(255,255,255,.08);--gb:rgba(255,255,255,.16);--b1:#3c3c3c;--b2:#1c1c1c;--inv:#000}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.6 Barlow,Cairo,system-ui,sans-serif;overflow-x:hidden}
[dir=rtl] body,[dir=rtl] button{font-family:Cairo,Barlow,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(40vmax 40vmax at 15% 10%,var(--b1),transparent 70%),radial-gradient(45vmax 45vmax at 90% 60%,var(--b2),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--tx);outline-offset:3px}
.g{background:var(--gl);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--gb);box-shadow:0 10px 40px rgba(0,0,0,.14)}
.d{font-family:"Barlow Condensed",Cairo,sans-serif;font-weight:800;text-transform:uppercase;line-height:.9;letter-spacing:-.01em}
[dir=rtl] .d{text-transform:none;line-height:1.15;font-family:Cairo,sans-serif}
header{position:fixed;top:0;inset-inline:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0}
.bar{max-width:1200px;margin:auto;height:50px;border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px}
[dir=rtl] .bar{padding:0 20px 0 12px}
.logo{font-size:26px;letter-spacing:.02em}
nav{display:flex;gap:26px}
nav a{color:inherit;text-decoration:none;font-weight:600}
.ic{width:42px;height:42px;border-radius:50%;display:inline-grid;place-items:center;position:relative;transition:background .2s,transform .15s}
.ic:hover{background:var(--gb)}.ic:active{transform:scale(.88)}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tools{display:flex;align-items:center;gap:4px}
.lang{font-weight:800;width:auto;padding:0 12px;border-radius:999px;font-size:14px}
#bd{position:absolute;top:2px;inset-inline-end:0;min-width:18px;height:18px;border-radius:9px;background:var(--tx);color:var(--inv);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px;transition:transform .3s}
#bd.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.3)}}
.hero{min-height:90svh;display:grid;align-content:center;justify-items:center;text-align:center;padding:110px 20px 60px;position:relative;overflow:hidden}
.big{font-size:clamp(88px,22vw,280px);display:flex;gap:.02em;direction:ltr;margin:0}
.big span{display:inline-block;transform:translateY(24px);opacity:0;animation:up 1.4s ease-out forwards}
.big span:nth-child(2){animation-delay:.12s}.big span:nth-child(3){animation-delay:.24s}
@keyframes up{to{transform:none;opacity:1}}
.slab{position:absolute;inset-inline:0;bottom:7vh;margin:auto;width:min(230px,58vw);border-radius:28px;padding:18px 18px 14px;transform:rotate(-3deg);animation:sl 1.2s .4s ease-out backwards}
.slab svg{width:100%;display:block}
.hero p{max-width:30ch;margin:18px 0 0;color:var(--mu);font-size:16px;position:relative}
.cta{margin-top:18px;background:var(--tx);color:var(--inv);padding:12px 28px;border-radius:999px;font-weight:800;font-size:16px;transition:transform .15s;position:relative;text-decoration:none;display:inline-block}
.cta:active{transform:scale(.95)}
.mq{overflow:hidden;border-block:1px solid var(--gb);padding:14px 0;direction:ltr}
.mq div{display:flex;gap:48px;width:max-content;animation:mq 26s linear infinite;font-size:22px}
@keyframes mq{to{transform:translateX(-50%)}}
section{max-width:1200px;margin:auto;padding:56px 16px 32px}
h2{font-size:clamp(32px,6vw,56px);margin:0 0 24px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 24px;scrollbar-width:none}
.chip{padding:9px 20px;border-radius:999px;border:1px solid var(--gb);white-space:nowrap;font-weight:600;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.92)}
.chip.on{background:var(--tx);color:var(--inv);border-color:var(--tx)}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:26px}
@media(min-width:720px){.cats{grid-template-columns:repeat(4,1fr)}}
.tile{animation:cp .8s ease-out backwards;animation-delay:calc(var(--i)*70ms);border-radius:22px;padding:12px 10px 14px;text-align:center;display:grid;gap:2px;font-weight:800;transition:transform .15s}
.tile:active{transform:scale(.95)}.tile.on{outline:2px solid var(--tx)}
.tile svg{width:64%;height:auto;aspect-ratio:1;margin:auto}.tile small{color:var(--mu);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{border-radius:26px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s;animation:cp .8s ease-out backwards;animation-delay:calc(var(--i)*55ms)}
.art{position:relative;aspect-ratio:1;display:grid;place-items:center;padding:12%;background:radial-gradient(circle at 50% 40%,var(--gb),transparent 70%)}
.art svg{width:100%;height:100%;filter:drop-shadow(0 14px 18px rgba(0,0,0,.28))}
.in{padding:2px 12px 14px;display:grid;gap:8px}
.in h3{margin:0;font-size:15px;font-weight:800;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.sz{display:flex;gap:6px}.sz .chip{padding:4px 12px;font-size:14px}
.add{background:var(--tx);color:var(--inv);border-radius:999px;padding:10px;font-weight:800;transition:transform .15s}
.add:active{transform:scale(.95)}
footer{text-align:center;color:var(--mu);padding:60px 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
#ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s}
#ov.on{opacity:1;pointer-events:auto}
#dr{position:fixed;z-index:31;top:10px;bottom:10px;inset-inline-end:10px;width:min(420px,calc(100vw - 20px));border-radius:28px;display:flex;flex-direction:column;transform:translateX(120%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:calc(env(safe-area-inset-top,0px)*0) 0 env(safe-area-inset-bottom,0px)}
[dir=rtl] #dr{transform:translateX(-120%)}
#dr.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 8px}
.dh h3{margin:0;font-size:32px}
#items{flex:1;overflow:auto;padding:8px 16px;display:grid;gap:10px;align-content:start}
.it{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--gb)}
.it .th{width:64px;height:64px;padding:6px}.it svg{width:100%;height:100%}
.it b{display:block;font-weight:800;line-height:1.3}.it small{color:var(--mu)}
.qt{display:flex;align-items:center;gap:2px;margin-top:4px}
.qt button{width:30px;height:30px;border-radius:50%;border:1px solid var(--gb);font-weight:800}
.qt button:active{transform:scale(.85)}
.em{text-align:center;color:var(--mu);padding:50px 10px}
.ft{padding:16px 20px 20px;display:grid;gap:12px}
.tot{display:flex;justify-content:space-between;font-size:22px;font-weight:800}
.ft .add{font-size:17px;padding:15px}
.p{position:fixed;z-index:60;width:8px;height:8px;border-radius:50%;background:var(--tx);pointer-events:none;animation:pf .65s ease-out forwards}
@keyframes pf{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
#ts{position:fixed;z-index:70;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);inset-inline:0;margin:auto;width:max-content;max-width:90vw;padding:12px 22px;border-radius:999px;font-weight:600;transform:translateY(150%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#ts.on{transform:none}
#pg{position:fixed;top:0;inset-inline:0;height:3px;background:var(--tx);transform:scaleX(0);transform-origin:left;z-index:25}[dir=rtl] #pg{transform-origin:right}
#in{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;overflow:hidden;transition:opacity .6s,visibility .6s}
#in.off{opacity:0;visibility:hidden}
#in .lo{font-size:clamp(70px,20vw,160px);position:relative;z-index:2;direction:ltr}
#in .lo span{display:inline-block;animation:soft 1.1s calc(.5s + var(--n)*.14s) ease-out backwards}
#in.off .lo{transform:scale(1.12);transition:transform .9s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
@keyframes soft{from{opacity:0;filter:blur(14px);transform:translateY(18px)}}
@keyframes cp{from{opacity:0;transform:translateY(16px)}}
@keyframes sl{from{opacity:0;transform:translateY(24px) rotate(-3deg)}}
body:not(.go) .big span,body:not(.go) .slab,body:not(.go) .card,body:not(.go) .tile{animation-play-state:paused}
.card:hover{transform:translateY(-5px)}
.fv{position:absolute;top:10px;inset-inline-end:10px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--gl);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--gb);transition:transform .15s}
.fv:active{transform:scale(.75)}
.fv svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;filter:none}
.fv.on svg{fill:currentColor;animation:pop .35s ease-out}
.rg{position:fixed;z-index:59;width:60px;height:60px;border-radius:50%;background:var(--tx);opacity:.16;pointer-events:none;animation:rg .9s ease-out forwards}
@keyframes rg{to{transform:scale(2.2);opacity:0}}
.fs{display:grid;gap:6px}.fs small{color:var(--mu)}
.fb{height:6px;border-radius:3px;background:var(--gb);overflow:hidden}.fb i{display:block;height:100%;width:0;background:var(--tx);transition:width .5s}
#cn{position:fixed;z-index:22;top:calc(env(safe-area-inset-top,0px) + 72px);inset-inline-end:14px;width:min(300px,calc(100vw - 28px));border-radius:24px;padding:16px;display:grid;gap:8px;opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .35s,transform .35s,visibility .35s}
#cn.on{opacity:1;visibility:visible;transform:none}
#cn h3{margin:0 0 4px;font-size:26px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;background:var(--gb);color:inherit;text-decoration:none;transition:background .25s}
.row:hover{background:var(--gl)}
.row svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row b{display:block;font-weight:800;line-height:1.3}.row small{color:var(--mu)}
.fl{position:absolute;width:calc(clamp(46px,12vw,92px)*var(--k));left:var(--x);top:110%;opacity:0;animation:rise 1.6s var(--t) cubic-bezier(.2,.8,.3,1) forwards,sway 3.5s calc(var(--t) + 1.6s) ease-in-out infinite alternate}
.fl svg{width:100%;display:block;filter:drop-shadow(0 10px 12px rgba(0,0,0,.25))}
@keyframes rise{from{top:110%;transform:rotate(0) scale(.4);opacity:0}30%{opacity:1}to{top:var(--y);transform:rotate(var(--r)) scale(1);opacity:1}}
@keyframes sway{from{transform:rotate(var(--r))}to{transform:translateY(-10px) rotate(calc(var(--r) + 5deg))}}
.ln{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);inset-inline:30%;height:2px;background:var(--gb);border-radius:2px;overflow:hidden}
.ln i{display:block;height:100%;background:var(--tx);transform:scaleX(0);transform-origin:left;animation:ld 3.2s linear forwards}
[dir=rtl] .ln i{transform-origin:right}
@keyframes ld{to{transform:scaleX(1)}}
.sk{position:absolute;inset-inline:0;text-align:center;bottom:calc(env(safe-area-inset-bottom,0px) + 50px);color:var(--mu);font-size:13px}
#py{position:fixed;z-index:40;inset:12px;margin:auto;width:min(540px,calc(100vw - 24px));height:fit-content;max-height:calc(100svh - 24px);overflow:auto;border-radius:28px;opacity:0;visibility:hidden;transform:translateY(24px);transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1),visibility .4s}
#py.on{opacity:1;visibility:visible;transform:none}
#pyb{padding:4px 20px 22px;display:grid;gap:16px}
.sec{display:grid;gap:8px}.sec>b{font-weight:800}
.fi{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--gb);background:var(--gb);color:inherit;font:inherit}
.fi.bad{border-color:#c0392b}.fi::placeholder{color:var(--mu)}.fi option{background:var(--bg);color:var(--tx)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:999px;background:var(--gb)}
.seg button{padding:9px 6px;border-radius:999px;font-weight:600;transition:background .3s,color .3s}
.seg button.on{background:var(--tx);color:var(--inv)}
.cr{display:flex;gap:8px}.cr .fi{text-transform:uppercase}
.cr button{padding:0 20px;border-radius:14px;background:var(--tx);color:var(--inv);font-weight:800}
.ml{display:flex;justify-content:space-between;gap:10px;color:var(--mu)}
.ml.t{color:var(--tx);font-size:21px;font-weight:800;padding-top:10px;border-top:1px solid var(--gb)}
.tg{font-size:14px;color:var(--mu)}.tg.ok{color:#2e8b57}.tg.no{color:#c0392b}
.ok2{width:84px;height:84px;margin:10px auto}
.ok2 circle,.ok2 path{fill:none;stroke:var(--tx);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:200;stroke-dashoffset:200;animation:dr 1s .1s ease-out forwards}
.ok2 path{animation-delay:.7s;animation-duration:.6s}
@keyframes dr{to{stroke-dashoffset:0}}
.in h3 span:last-child{font-weight:500;color:var(--mu)}
@media(max-width:720px){nav{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
